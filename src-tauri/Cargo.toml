[package]
name = "avtool"
version = "0.2.0"
description = "AVTool 音视频码流分析工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "avtool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
